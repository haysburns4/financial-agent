[project]
name = "financial-agent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy>=2.0",
    "greenlet>=3.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pyetrade>=2.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "apscheduler>=3.10",
    "pandas>=2.0",
    "pandas-ta>=0.3",
    "tenacity>=8.2",
    "loguru>=0.7",
    "httpx>=0.27",
    "cryptography>=42",
    "yfinance>=1.3.0",
    "anthropic>=0.104.1",
    "ag-ui-protocol>=1.0",
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "pandas-market-calendars>=5.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
# Alternate LLM provider for LLM_PROVIDER=openai. Not needed for the default
# anthropic backend; see src/llm/factory.py.
openai = [
    "openai>=1.51",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The app runs as `python -m src.main` from the repo root rather than as an
# installed package, so tests need the root on sys.path too.
pythonpath = ["."]

[dependency-groups]
dev = [
    "mlx-lm>=0.32.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
